name: Verify

# Läuft bei jedem Push und jedem Pull Request – unabhängig vom Default-Branch.
# Die Publishing-Pipeline ist ein Cron-Job; dieser Workflow ist das Sicherheitsnetz
# davor und braucht keine Secrets.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: XSD-Validator bereitstellen
        # python3-lxml ist auf den Runnern nicht garantiert; ohne Validator würde
        # die ONIX-Prüfung stillschweigend übersprungen.
        run: |
          if ! command -v xmllint >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq libxml2-utils
          fi
          xmllint --version

      - name: Vollständige Abnahme
        # Prüft Umgebung, Syntax, Testsuite, Pipeline (echte Bytes) und einen
        # echten HTTP-Server. Exit-Code 1 bei jedem Fehlschlag.
        run: npm run verify

      - name: Abnahmebericht als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-${{ github.run_id }}
          path: |
            artifacts/verify-report.json
            artifacts/onix3.xml
          if-no-files-found: warn
          retention-days: 14
