# Wöchentliche Updates, gruppiert: eine PR pro Woche statt fünf.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    groups:
      produktion:
        patterns: ['*']
        dependency-type: production
      entwicklung:
        patterns: ['*']
        dependency-type: development
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
